<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#0b0e1a" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  
  <!-- Outer Sacred Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#neon)" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#gold)" stroke-width="2.5" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#neon)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Sacred Hexagram & Star -->
  <polygon points="256,116 377,326 135,326" fill="none" stroke="url(#gold)" stroke-width="2" />
  <polygon points="256,396 377,186 135,186" fill="none" stroke="url(#gold)" stroke-width="2" />

  <!-- Center Core Starburst -->
  <circle cx="256" cy="256" r="28" fill="#38bdf8" fill-opacity="0.2" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" />
  
  <!-- Compass Nodes -->
  <circle cx="256" cy="86" r="8" fill="url(#gold)" />
  <circle cx="256" cy="426" r="8" fill="url(#gold)" />
  <circle cx="86" cy="256" r="8" fill="url(#gold)" />
  <circle cx="426" cy="256" r="8" fill="url(#gold)" />

  <!-- Crescent Moons -->
  <path d="M 256,120 A 40,40 0 0,0 256,170 A 30,30 0 0,1 256,120" fill="url(#gold)" />
  <path d="M 256,392 A 40,40 0 0,0 256,342 A 30,30 0 0,1 256,392" fill="url(#gold)" />

  <!-- Outer Ring Stars -->
  <circle cx="160" cy="160" r="4" fill="#ffffff" />
  <circle cx="352" cy="160" r="4" fill="#ffffff" />
  <circle cx="160" cy="352" r="4" fill="#ffffff" />
  <circle cx="352" cy="352" r="4" fill="#ffffff" />
</svg>
